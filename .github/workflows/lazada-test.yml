name: Lazada GitHub test

on:
  workflow_dispatch:
    inputs:
      gap:
        description: "Seconds between checks"
        default: "90"
      rounds:
        description: "Number of checks (90s x 200 = 5 hours)"
        default: "3"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          sudo apt-get install -y xvfb

      - name: Run test
        env:
          GAP: ${{ inputs.gap }}
          ROUNDS: ${{ inputs.rounds }}
        run: xvfb-run -a python lazada_gh_test.py
